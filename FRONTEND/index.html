<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Test Kezdõcsapat</title>
    <script>
        async function sendPlayers() {
            const response = await fetch("http://localhost:5000/api/formation/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify([
                    { name: "Nagy Péter", position: "GK" },
                    { name: "Kis Gábor", position: "DF" },
                    { name: "Kovács László", position: "DF" },
                    { name: "Szabó Dániel", position: "DF" },
                    { name: "Tóth András", position: "DF" },
                    { name: "Farkas Bence", position: "MF" },
                    { name: "Varga Levente", position: "MF" },
                    { name: "Németh Márk", position: "MF" },
                    { name: "Simon Ádám", position: "FW" },
                    { name: "Lukács Zoltán", position: "FW" },
                    { name: "Molnár Erik", position: "FW" }
                ])
            });

            const formations = await response.json();
            console.log(formations); // You can also render it in HTML
            document.getElementById("result").innerText = JSON.stringify(formations, null, 2);
        }
    </script>
</head>
<body>
    <h1>Kezdõcsapat Teszt</h1>
    <button onclick="sendPlayers()">Kezdõ 11 generálása</button>
    <pre id="result"></pre>
</body>
</html>
